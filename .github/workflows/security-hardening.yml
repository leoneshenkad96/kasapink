name: ERP Security Hardening Regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/api-server/src/**'
      - 'lib/db/migrations/0024_auth_rate_limit.sql'
      - 'vercel.json'
      - 'scripts/audit-safe.test.mjs'
      - '.github/workflows/security-hardening.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Validate types
        run: pnpm run typecheck
      - name: Verify audit redaction
        run: node --test scripts/audit-safe.test.mjs
      - name: Verify session auth
        run: pnpm test:auth
      - name: Verify frontend/API build
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
