name: ERP Node.js Security Baseline
on:
  pull_request:
    branches: [main]
    paths:
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vercel.json'
      - 'scripts/check-node-security.mjs'
      - '.github/workflows/node-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: 'pnpm'
      - name: Verify Node.js security baseline
        run: pnpm run check:node-security
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test authentication
        run: pnpm run test:auth
      - name: Build ERP frontend and API
        run: pnpm run build
