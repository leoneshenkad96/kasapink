kind = "web"
previewPath = "/"
title = "ERP Rumahan Emak"
description = "A practical Indonesian small-business ERP for managing ingredients, recipes, purchases, sales, stock counts, and profit with recipe-based inventory consumption."
version = "1.0.0"
id = "artifacts/erp-rumahan-emak"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21076

[services.development]
run = "pnpm --filter @workspace/erp-rumahan-emak run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/erp-rumahan-emak", "run", "build" ]
serve = "static"
publicDir = "artifacts/erp-rumahan-emak/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21076"
BASE_PATH = "/"
