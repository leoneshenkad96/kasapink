openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for Kasapink ERP
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: erp
    description: Inventory, recipe, purchase, sales, and finance operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /erp/state:
    get:
      operationId: getErpState
      tags: [erp]
      summary: Get the current ERP workspace data
      responses:
        "200":
          description: Current ingredients, products, recipes, recent transactions, and daily totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErpState"
  /erp/finance:
    get:
      operationId: getFinanceReport
      tags: [erp]
      summary: Get finance totals for a date range
      parameters:
        - in: query
          name: startDate
          required: true
          schema: { type: string, format: date }
        - in: query
          name: endDate
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Revenue, cost of goods sold, purchases, and gross profit grouped by date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceReport"
  /erp/ingredients:
    post:
      operationId: createIngredient
      tags: [erp]
      summary: Add an ingredient or stock item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientInput"
      responses:
        "201":
          description: Ingredient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
  /erp/ingredients/{ingredientId}:
    patch:
      operationId: updateIngredient
      tags: [erp]
      summary: Update ingredient details and minimum stock
      parameters:
        - in: path
          name: ingredientId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientUpdate"
      responses:
        "200":
          description: Updated ingredient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
  /erp/products:
    post:
      operationId: createProduct
      tags: [erp]
      summary: Add a sale product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /erp/products/{productId}:
    patch:
      operationId: updateProduct
      tags: [erp]
      summary: Update a product name or selling price
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /erp/products/{productId}/recipe:
    put:
      operationId: saveProductRecipe
      tags: [erp]
      summary: Replace a product recipe
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: Saved recipe items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeItem"
  /erp/purchases:
    post:
      operationId: recordPurchase
      tags: [erp]
      summary: Record a purchase and add stock atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "201":
          description: Saved purchase and detail lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
  /erp/sales:
    post:
      operationId: recordSale
      tags: [erp]
      summary: Record a sale, consume recipe stock, and calculate cost of goods sold atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Saved sale and calculated line totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "409":
          description: A recipe is missing or there is not enough stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /erp/stock-counts:
    post:
      operationId: recordStockCount
      tags: [erp]
      summary: Record a physical stock count and audit adjustments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockCountInput"
      responses:
        "200":
          description: Updated inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockCountResponseItem"
  /erp/fnb-report:
    get:
      operationId: getFnbReport
      tags: [erp]
      summary: Get recipe usage and stock opname variances for a date range
      parameters:
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: F&B report with separate recipe usage and stock opname variances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FnbReport"
  /health:
    get:
      operationId: legacyHealthCheck
      tags: [health]
      summary: Compatibility health check path
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyHealthStatus"
  /ingredients:
    post:
      operationId: legacyCreateIngredient
      tags: [erp]
      summary: Compatibility path to add an ingredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientInput"
      responses:
        "201":
          description: Ingredient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
  /ingredients/{ingredientId}:
    put:
      operationId: legacyUpdateIngredient
      tags: [erp]
      summary: Compatibility path to update an ingredient
      parameters:
        - in: path
          name: ingredientId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientUpdate"
      responses:
        "200":
          description: Updated ingredient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
  /products:
    post:
      operationId: legacyCreateProduct
      tags: [erp]
      summary: Compatibility path to add a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{productId}:
    put:
      operationId: legacyUpdateProduct
      tags: [erp]
      summary: Compatibility path to update a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{productId}/recipe:
    post:
      operationId: legacySaveProductRecipe
      tags: [erp]
      summary: Compatibility path to replace a product recipe
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: Saved recipe items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeItem"
  /purchases:
    post:
      operationId: legacyRecordPurchase
      tags: [erp]
      summary: Compatibility path to record a purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "201":
          description: Purchase recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
  /sales:
    post:
      operationId: legacyRecordSale
      tags: [erp]
      summary: Compatibility path to record a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Sale recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "409":
          description: Recipe is missing or stock is insufficient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stock-counts:
    post:
      operationId: legacyRecordStockCount
      tags: [erp]
      summary: Compatibility path to record a stock count
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockCountInput"
      responses:
        "200":
          description: Updated inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockCountResponseItem"
  /finance/report:
    get:
      operationId: legacyGetFinanceReport
      tags: [erp]
      summary: Compatibility path to get a finance report
      parameters:
        - in: query
          name: startDate
          required: true
          schema: { type: string, format: date }
        - in: query
          name: endDate
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Finance totals grouped by date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceReport"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LegacyHealthStatus:
      type: object
      properties:
        status: { type: string, enum: [OK] }
        timestamp: { type: string, format: date-time }
      required: [status, timestamp]
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    Ingredient:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        stockType: { type: string, enum: [Makanan, Parfum] }
        unit: { type: string }
        stock: { type: number }
        minStock: { type: number }
        lastPrice: { type: number }
        averageCost: { type: number }
      required: [id, name, category, stockType, unit, stock, minStock, lastPrice, averageCost]
    IngredientInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, minLength: 1 }
        stockType: { type: string, enum: [Makanan, Parfum], default: Makanan }
        unit: { type: string, minLength: 1, maxLength: 30 }
        stock: { type: number, minimum: 0 }
        minStock: { type: number, minimum: 0 }
        openingUnitCost: { type: number, minimum: 0 }
      required: [name, category, stockType, unit, stock, minStock, openingUnitCost]
    IngredientUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, minLength: 1 }
        stockType: { type: string, enum: [Makanan, Parfum] }
        unit: { type: string, minLength: 1, maxLength: 30 }
        minStock: { type: number, minimum: 0 }
    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        sellingPrice: { type: number }
        businessType: { type: string, enum: [Makanan, Parfum] }
        needsRecipe: { type: boolean }
        stock: { type: number }
        averageCost: { type: number }
      required: [id, name, sellingPrice, businessType, needsRecipe, stock, averageCost]
    ProductInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        sellingPrice: { type: number, minimum: 0 }
        businessType: { type: string, enum: [Makanan, Parfum], default: Makanan }
        needsRecipe: { type: boolean, default: true }
        stock: { type: number, minimum: 0, default: 0 }
        averageCost: { type: number, minimum: 0, default: 0 }
        autoRecipeIngredientId: { type: integer, minimum: 1 }
      required: [name, sellingPrice, businessType]
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        sellingPrice: { type: number, minimum: 0 }
        businessType: { type: string, enum: [Makanan, Parfum] }
        needsRecipe: { type: boolean }
        stock: { type: number, minimum: 0 }
        averageCost: { type: number, minimum: 0 }
    RecipeItem:
      type: object
      properties:
        productId: { type: integer }
        ingredientId: { type: integer }
        ingredientName: { type: string }
        unit: { type: string }
        recipeUnit: { type: string }
        qtyRequired: { type: number }
      required: [productId, ingredientId, ingredientName, unit, recipeUnit, qtyRequired]
    RecipeLineInput:
      type: object
      properties:
        ingredientId: { type: integer }
        recipeUnit: { type: string, minLength: 1, maxLength: 30 }
        qtyRequired: { type: number, exclusiveMinimum: 0 }
      required: [ingredientId, recipeUnit, qtyRequired]
    RecipeInput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecipeLineInput"
      required: [items]
    PurchaseLineInput:
      type: object
      properties:
        ingredientId: { type: integer }
        quantity: { type: number, exclusiveMinimum: 0 }
        totalCost: { type: number, minimum: 0 }
      required: [ingredientId, quantity, totalCost]
    PurchaseInput:
      type: object
      properties:
        date: { type: string, format: date }
        supplierType: { type: string, minLength: 1, maxLength: 120 }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PurchaseLineInput"
      required: [date, supplierType, items]
    PurchaseLine:
      type: object
      properties:
        ingredientId: { type: integer }
        ingredientName: { type: string }
        unit: { type: string }
        quantity: { type: number }
        totalCost: { type: number }
        unitCost: { type: number }
      required: [ingredientId, ingredientName, unit, quantity, totalCost, unitCost]
    Purchase:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        supplierType: { type: string }
        totalCost: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseLine"
      required: [id, date, supplierType, totalCost, items]
    SaleLineInput:
      type: object
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }
      required: [productId, quantity]
    SaleInput:
      type: object
      properties:
        date: { type: string, format: date }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SaleLineInput"
      required: [date, items]
    SaleLine:
      type: object
      properties:
        productId: { type: integer }
        productName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        revenue: { type: number }
        costOfGoodsSold: { type: number }
      required: [productId, productName, quantity, unitPrice, revenue, costOfGoodsSold]
    Sale:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        totalRevenue: { type: number }
        totalCostOfGoodsSold: { type: number }
        grossProfit: { type: number }
        warnings:
          type: array
          items: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleLine"
      required: [id, date, totalRevenue, totalCostOfGoodsSold, grossProfit, items]
    StockCountLineInput:
      type: object
      properties:
        ingredientId: { type: integer, minimum: 1 }
        preparationId: { type: integer, minimum: 1 }
        countedStock:
          type: number
          minimum: 0
          description: Physical stock quantity, up to three decimal places.
      required: [countedStock]
      oneOf:
        - required: [ingredientId]
          not:
            required: [preparationId]
        - required: [preparationId]
          not:
            required: [ingredientId]
    StockCountInput:
      type: object
      properties:
        date: { type: string, format: date }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/StockCountLineInput"
      required: [date, items]
    StockCountResponseItem:
      type: object
      properties:
        id: { type: integer }
        itemType: { type: string, enum: [ingredient, preparation] }
        itemId: { type: integer }
        date: { type: string, format: date }
        name: { type: string }
        unit: { type: string }
        stock: { type: number }
        stockBefore: { type: number }
        countedStock: { type: number }
        stockAfter: { type: number }
        quantityDelta: { type: number }
        varianceQty: { type: number }
        unitCost: { type: number }
        varianceValue: { type: number }
        category: { type: string }
        stockType: { type: string, enum: [Makanan, Parfum] }
        minStock: { type: number }
        lastPrice: { type: number }
        averageCost: { type: number }
        yieldQty: { type: number }
        active: { type: boolean }
      required: [id, itemType, itemId, date, name, unit, stock, stockBefore, countedStock, stockAfter, quantityDelta, varianceQty, unitCost, varianceValue]
    RecipeUsageVariance:
      type: object
      properties:
        itemType: { type: string, enum: [ingredient, preparation] }
        itemId: { type: integer }
        itemName: { type: string }
        unit: { type: string }
        actualQty: { type: number }
        theoreticalQty: { type: number }
        varianceQty: { type: number }
        varianceCost: { type: number }
      required: [itemType, itemId, itemName, unit, actualQty, theoreticalQty, varianceQty, varianceCost]
    StockOpnameVariance:
      type: object
      properties:
        movementId: { type: integer }
        itemType: { type: string, enum: [ingredient, preparation] }
        itemId: { type: integer }
        itemName: { type: string }
        date: { type: string, format: date }
        unit: { type: string }
        systemStock: { type: number }
        physicalStock: { type: number }
        varianceQty: { type: number }
        unitCost: { type: [number, "null"] }
        varianceValue: { type: [number, "null"] }
      required: [movementId, itemType, itemId, itemName, date, unit, systemStock, physicalStock, varianceQty, unitCost, varianceValue]
    FnbReport:
      type: object
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        revenue: { type: number }
        actualCogs: { type: number }
        theoreticalCogs: { type: number }
        actualFoodCostPercentage: { type: number }
        theoreticalFoodCostPercentage: { type: number }
        foodCostVariance: { type: number }
        wasteCost: { type: number }
        grossProfit: { type: number }
        operatingExpenses: { type: number }
        netProfit: { type: number }
        wasteCount: { type: integer }
        recipeUsageVariance:
          type: array
          items: { $ref: "#/components/schemas/RecipeUsageVariance" }
        inventoryVariance:
          type: array
          deprecated: true
          description: Legacy alias for recipeUsageVariance.
          items: { $ref: "#/components/schemas/RecipeUsageVariance" }
        stockOpnameVariance:
          type: array
          items: { $ref: "#/components/schemas/StockOpnameVariance" }
        menus:
          type: array
          items:
            type: object
            properties:
              productId: { type: integer }
              productName: { type: string }
              quantity: { type: number }
              revenue: { type: number }
              actualCogs: { type: number }
              theoreticalCogs: { type: number }
              grossProfit: { type: number }
              foodCostPercentage: { type: number }
            required: [productId, productName, quantity, revenue, actualCogs, theoreticalCogs, grossProfit, foodCostPercentage]
        waste:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              date: { type: string, format: date }
              itemType: { type: string, enum: [ingredient, preparation] }
              itemId: { type: integer }
              quantity: { type: number }
              unit: { type: string }
              totalCost: { type: number }
              reason: { type: string }
              note: { type: [string, "null"] }
            required: [id, date, itemType, itemId, quantity, unit, totalCost, reason, note]
        expenses:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              date: { type: string, format: date }
              category: { type: string }
              description: { type: string }
              amount: { type: number }
            required: [id, date, category, description, amount]
      required: [startDate, endDate, revenue, actualCogs, theoreticalCogs, actualFoodCostPercentage, theoreticalFoodCostPercentage, foodCostVariance, wasteCost, grossProfit, operatingExpenses, netProfit, wasteCount, recipeUsageVariance, inventoryVariance, stockOpnameVariance, menus, waste, expenses]
    DailyFinance:
      type: object
      properties:
        date: { type: string, format: date }
        revenue: { type: number }
        costOfGoodsSold: { type: number }
        purchases: { type: number }
        grossProfit: { type: number }
      required: [date, revenue, costOfGoodsSold, purchases, grossProfit]
    FinanceReport:
      type: object
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        revenue: { type: number }
        costOfGoodsSold: { type: number }
        purchases: { type: number }
        grossProfit: { type: number }
        days:
          type: array
          items:
            $ref: "#/components/schemas/DailyFinance"
      required: [startDate, endDate, revenue, costOfGoodsSold, purchases, grossProfit, days]
    ErpState:
      type: object
      properties:
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/Ingredient" }
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        recipes:
          type: array
          items: { $ref: "#/components/schemas/RecipeItem" }
        recentPurchases:
          type: array
          items: { $ref: "#/components/schemas/Purchase" }
        recentSales:
          type: array
          items: { $ref: "#/components/schemas/Sale" }
        today:
          $ref: "#/components/schemas/DailyFinance"
        lowStockCount: { type: integer }
      required: [ingredients, products, recipes, recentPurchases, recentSales, today, lowStockCount]

